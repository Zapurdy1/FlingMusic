<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In – Fling Music</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">Fling Music</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="signin.html" class="active">Sign In</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
    </div>
  </nav>

  <main class="container content">
    <h1>Sign In</h1>
    <form id="signinForm" class="auth-form">
      <label for="signinUsername">Username</label>
      <input id="signinUsername" name="username" required>

      <label for="signinPassword">Password</label>
      <input id="signinPassword" name="password" type="password" required>

      <button type="submit" class="primary-btn">Sign In</button>
      <p id="signinMessage" class="message"></p>
    </form>
  </main>

  <footer class="footer">
    <div class="container">
      &copy; 2025 Fling Music
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
